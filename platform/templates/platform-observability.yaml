{{- if .Values.observability.recordingRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-observability
  namespace: monitoring
  labels:
    # kube-prometheus-stack's default ruleSelector matches on this label;
    # management's stack selects every rule, but keep it for stacks that don't.
    release: kube-prometheus-stack
spec:
  groups:
    # Translates raw cAdvisor / kube-state-metrics series into the platform's
    # component/environment identity, so dashboards and alerts never join
    # against Kubernetes pod labels themselves. Rules in a group evaluate in
    # order, so the later rules read platform:pod_identity:info from the same
    # evaluation.
    - name: platform.infrastructure
      rules:
        # One series per platform pod, value 1. A pod is a platform workload
        # only if it carries both platform.taskapp.io/{component,environment}
        # labels; everything else (Prometheus, ArgoCD, ...) is absent here and
        # so drops out of every join below. Requires kube-state-metrics'
        # metricLabelsAllowlist to expose those two pod labels.
        - record: platform:pod_identity:info
          expr: |
            max by (namespace, pod, component, environment) (
              label_replace(
                label_replace(
                  kube_pod_labels{
                    job="kube-state-metrics",
                    label_platform_taskapp_io_component!="",
                    label_platform_taskapp_io_environment!=""
                  },
                  "component", "$1", "label_platform_taskapp_io_component", "(.+)"
                ),
                "environment", "$1", "label_platform_taskapp_io_environment", "(.+)"
              )
            )

        # container!="" drops cAdvisor's pod-level cgroup and pause-container
        # series; container!="POD" covers the pause container on Docker-based
        # runtimes.
        - record: platform:container_cpu_usage_cores
          expr: |
            sum by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{
                job="kubelet",
                metrics_path="/metrics/cadvisor",
                container!="",
                container!="POD"
              }[5m])
            )
            * on (namespace, pod) group_left (component, environment)
            platform:pod_identity:info

        - record: platform:container_memory_working_set_bytes
          expr: |
            sum by (namespace, pod, container) (
              container_memory_working_set_bytes{
                job="kubelet",
                metrics_path="/metrics/cadvisor",
                container!="",
                container!="POD"
              }
            )
            * on (namespace, pod) group_left (component, environment)
            platform:pod_identity:info

        # Containers without a limit have no series, so a component's limit
        # sum only covers limited containers.
        - record: platform:container_cpu_limit_cores
          expr: |
            sum by (namespace, pod, container) (
              kube_pod_container_resource_limits{
                job="kube-state-metrics",
                resource="cpu",
                unit="core"
              }
            )
            * on (namespace, pod) group_left (component, environment)
            platform:pod_identity:info

        - record: platform:container_memory_limit_bytes
          expr: |
            sum by (namespace, pod, container) (
              kube_pod_container_resource_limits{
                job="kube-state-metrics",
                resource="memory",
                unit="byte"
              }
            )
            * on (namespace, pod) group_left (component, environment)
            platform:pod_identity:info
{{- end }}
