{{- $remoteRef := required "database.remoteRef is required: the Database's published location" .Values.database.remoteRef -}}
# The connection details, pulled from where the Database published them. Same
# keys the service's own database binding gets (endpoint, port, username,
# password, dbname), plus a `url` built from them for Atlas.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "database-schema.secretName" . }}
  labels:
    {{- include "database-schema.labels" . | nindent 4 }}
  annotations:
    # Before the AtlasMigration, so Atlas doesn't spend its retries on a
    # Secret that doesn't exist yet.
    argocd.argoproj.io/sync-wave: "-2"
    {{- include "database-schema.annotations" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ include "database-schema.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Keep the extracted keys and add `url`.
      mergePolicy: Merge
      data:
        # urlquery escapes the generated password for the URL. RDS refuses
        # connections without TLS by default (Postgres 16), hence require.
        url: {{ `"postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@{{ .endpoint }}:{{ .port }}/{{ .dbname }}?sslmode=require"` }}
  dataFrom:
    - extract:
        key: {{ $remoteRef }}
