{{- /*
One ArgoCD cluster Secret per registered workload cluster. Each cluster's own
Terraform workspace (bootstrap-cluster/terraform/<env>-eks) publishes its
endpoint and CA to taskapp/clusters/<env> in Secrets Manager; ESO templates
that into the Secret shape ArgoCD watches for. The environment label is what
every ApplicationSet's clusters generator matches on.

No credential is stored: awsAuthConfig makes ArgoCD mint an EKS token from
its own Pod Identity role (taskapp-argocd), which the cluster's access entry
authorizes. deletionPolicy Delete: when the cluster is destroyed and its
Secrets Manager entry goes away, ArgoCD forgets the cluster too.
*/ -}}
{{- range .Values.registeredClusters }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cluster-{{ . }}
  namespace: argocd
  labels:
    app: {{ $.Chart.Name }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: cluster-{{ . }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          environment: {{ . }}
      data:
        name: {{ . }}
        server: '{{ "{{ .server }}" }}'
        config: |
          {
            "awsAuthConfig": { "clusterName": "{{ "{{ .clusterName }}" }}" },
            "tlsClientConfig": { "insecure": false, "caData": "{{ "{{ .caData }}" }}" }
          }
  dataFrom:
    - extract:
        key: taskapp/clusters/{{ . }}
{{- end }}
