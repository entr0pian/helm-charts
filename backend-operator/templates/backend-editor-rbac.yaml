apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "backend-operator.fullname" . }}-backend-editor-role
  labels:
  {{- include "backend-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - apps.taskapp.io
  resources:
  - backends
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.taskapp.io
  resources:
  - backends/status
  verbs:
  - get
