{{- if .Values.grafanaDashboard.enabled }}
# Platform — Service Overview: one dashboard for every platform component,
# selected by the component/environment variables. Panels read only
# application metrics and the platform.infrastructure recording rules
# (platform-observability.yaml), never raw cAdvisor / kube-state-metrics, so
# it renders nothing unless observability.recordingRules is enabled too.
# kube-prometheus-stack's Grafana sidecar picks up any ConfigMap labelled
# grafana_dashboard=1 in any namespace. The JSON lives in its own file so
# Grafana's legend templates aren't parsed by Helm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-service-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-service-overview.json: |
{{ .Files.Get "dashboards/platform-service-overview.json" | indent 4 }}
{{- end }}
