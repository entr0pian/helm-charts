namespace: default

clusterSecretStore:
  name: aws-secrets-manager
  aws:
    region: eu-west-1
    credentialsSecret:
      name: aws-credentials
      namespace: external-secrets

externalSecrets:
  clusterSecretStoreName: aws-secrets-manager

crossplane:
  # Path to the secret in AWS Secrets Manager, holding the AWS credentials the
  # crossplane-provider-config chart's AWS ProviderConfig references.
  # Expected JSON format: {"aws_access_key_id": "<value>", "aws_secret_access_key": "<value>"}
  # Provider packages themselves are no longer installed from here - Crossplane's own
  # package manager installs them via each Configuration package's crossplane.yaml
  # dependsOn (see crossplane-compositions). This only delivers credentials for
  # ProviderConfig to reference.
  # Leave empty to skip creating the ExternalSecret.
  secretPath: ""

argocdWriteToken:
  # Path to the secret in AWS Secrets Manager, holding the GitHub token
  # application-repository-operator uses to commit into taskapp-argocd.
  # Expected JSON format: {"token": "<value>"}
  # Leave empty to skip creating the ExternalSecret.
  secretPath: ""

crossplaneGithub:
  # Path to the secret in AWS Secrets Manager, holding the dedicated PAT the
  # crossplane-compositions GitHubRepository composition uses via provider-upjet-github.
  # Expected JSON format: {"token": "<value>", "owner": "<github org or user>"}
  # Leave empty to skip creating the ExternalSecret.
  secretPath: ""

prometheusRules:
  enabled: false

grafanaDashboard:
  enabled: false

limitRange:
  enabled: true
  container:
    # Injected into containers with no requests defined (frontend, database)
    defaultRequest:
      cpu: 200m
      memory: 128Mi
    # Injected into containers with no limits defined (frontend, database)
    default:
      cpu: 500m
      memory: 256Mi
    # Must be <= backend requests (cpu: 250m, memory: 64Mi)
    min:
      cpu: 50m
      memory: 64Mi
    # Must be >= backend limits (cpu: 1000m, memory: 256Mi)
    max:
      cpu: "2"
      memory: 1Gi
    # Backend ratio: cpu 1000m/250m = 4x, memory 256Mi/64Mi = 4x
    maxLimitRequestRatio:
      cpu: "4"
      memory: "4"
