{{- if .Values.componentNamespace.create }}
{{- /*
The fixed namespace every Component (and its GitHubRepository XR, composed
MRs and ScaffoldRequest) lives in on management - release-operator hardcodes
it as componentNamespace. Owned here so it exists before any Component (the
taskapp-platform registry apps sync later and keep CreateNamespace=true as a
no-op), and before the argocd-github-webhook Secret the composition's
RepositoryWebhooks read from it.

Never pruned or deleted with this app: losing it would delete every
Component, XR and Repository MR, and through them the GitHub repos.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.componentNamespace.name }}
  labels:
    app: {{ .Chart.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
{{- end }}
