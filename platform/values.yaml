namespace: default

clusterSecretStore:
  name: aws-secrets-manager
  aws:
    region: eu-west-1
    credentialsSecret:
      name: aws-credentials
      namespace: external-secrets

externalSecrets:
  clusterSecretStoreName: aws-secrets-manager

crossplane:
  # Path to the secret in AWS Secrets Manager.
  # Expected JSON format: {"aws_access_key_id": "<value>", "aws_secret_access_key": "<value>"}
  # Leave empty to skip creating the ExternalSecret, Provider, and ProviderConfig.
  secretPath: ""
  providers:
    - name: provider-aws-sqs
      package: xpkg.upbound.io/upbound/provider-aws-sqs:v1.14.0
    - name: provider-aws-ec2
      package: xpkg.upbound.io/upbound/provider-aws-ec2:v2.6.3
    - name: provider-aws-rds
      package: xpkg.upbound.io/upbound/provider-aws-rds:v2.6.3
    # Pinned explicitly (not just pulled in as a transitive dependency): provider-aws-ec2/rds
    # require this exact version, but provider-aws-sqs accepts any version, so leaving it
    # implicit lets the resolver silently pick the registry's newest tag on every fresh
    # cluster bootstrap and drift out of sync with the ec2/rds pin. Bump this together with
    # provider-aws-ec2/rds whenever either changes.
    - name: provider-family-aws
      package: xpkg.upbound.io/upbound/provider-family-aws:v2.6.3
    - name: provider-kubernetes
      package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.17.0

argocdWriteToken:
  # Path to the secret in AWS Secrets Manager, holding the GitHub token
  # application-repository-operator uses to commit into taskapp-argocd.
  # Expected JSON format: {"token": "<value>"}
  # Leave empty to skip creating the ExternalSecret.
  secretPath: ""

prometheusRules:
  enabled: false

grafanaDashboard:
  enabled: false

limitRange:
  enabled: true
  container:
    # Injected into containers with no requests defined (frontend, database)
    defaultRequest:
      cpu: 200m
      memory: 128Mi
    # Injected into containers with no limits defined (frontend, database)
    default:
      cpu: 500m
      memory: 256Mi
    # Must be <= backend requests (cpu: 250m, memory: 64Mi)
    min:
      cpu: 50m
      memory: 64Mi
    # Must be >= backend limits (cpu: 1000m, memory: 256Mi)
    max:
      cpu: "2"
      memory: 1Gi
    # Backend ratio: cpu 1000m/250m = 4x, memory 256Mi/64Mi = 4x
    maxLimitRequestRatio:
      cpu: "4"
      memory: "4"
