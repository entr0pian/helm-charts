{{- if .Values.argocdGithubWebhook.secretPath }}
{{- /*
HMAC secret for ArgoCD's GitHub webhooks (bootstrap-cluster/terraform/
github-webhooks), synced into the two namespaces that read it:
- argocd: argocd-secret references it as webhook.github.secret:
  "$argocd-github-webhook:secret". ArgoCD only resolves that from Secrets
  labelled app.kubernetes.io/part-of=argocd.
- the Component namespace: the githubrepository composition's
  RepositoryWebhook secretSecretRef/urlSecretRef only take {name, key},
  resolved in the MR's own namespace.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook
  namespace: argocd
  labels:
    app: {{ .Chart.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: argocd-github-webhook
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
  - secretKey: secret
    remoteRef:
      key: {{ .Values.argocdGithubWebhook.secretPath }}
      property: secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook
  namespace: {{ .Values.componentNamespace.name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: argocd-github-webhook
    creationPolicy: Owner
    template:
      data:
        secret: "{{ `{{ .secret }}` }}"
        url: {{ .Values.argocdGithubWebhook.url | quote }}
  data:
  - secretKey: secret
    remoteRef:
      key: {{ .Values.argocdGithubWebhook.secretPath }}
      property: secret
{{- end }}
